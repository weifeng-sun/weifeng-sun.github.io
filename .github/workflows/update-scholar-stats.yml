name: Update Scholar stats

on:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch citation count 📈
        run: python3 bin/update_scholar_stats.py
      - name: Commit and redeploy 🚀
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "Scholar stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Scholar stats" -- _data/scholar.yml
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
